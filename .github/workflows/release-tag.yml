name: Release tag

on:
  workflow_run:
    workflows:
      - Tracen CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-tag-main
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@just

      - name: Create release tag if needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just workflow-release-tag
