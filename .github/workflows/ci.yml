name: Tracen CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      audit: ${{ steps.filter.outputs.audit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/**'
              - 'justfile'
              - 'scripts/**'

            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - 'crates/**/*.tracker'
              - 'crates/**/*.json'
              - 'crates/**/tests/**'
              - 'crates/**/benches/**'
              - 'crates/tracen_pack_codegen/templates/**'

            ts:
              - '**/*.ts'
              - '**/*.tsx'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'crates/tracen_pack_codegen/templates/**'
              - 'crates/tracen_pack_codegen/tests/**'

            audit:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'

  rust:
    name: rust
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@just

      - name: Rust fmt
        run: just fmt-check

      - name: Rust clippy
        run: just clippy

      - name: Snapshot characterization tests
        run: just snapshot-check

      - name: Rust tests
        run: just test

      - name: Rust docs
        run: just doc

  ts:
    name: ts
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.ts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@just

      - name: TypeScript checks
        run: just workflow-ts-check

  security-audit:
    name: security-audit
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.audit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cargo-audit

      - name: Cargo audit
        run: just audit
        continue-on-error: true

  pipeline:
    name: pipeline
    needs:
      - changes
      - rust
      - ts
      - security-audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@just

      - name: Verify CI result
        run: just workflow-ci-result "${{ needs.changes.result }}" "${{ needs.rust.result }}" "${{ needs.ts.result }}" "${{ needs.security-audit.result }}"
