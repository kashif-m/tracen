name: Tracen CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      audit: ${{ steps.filter.outputs.audit }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/**'
              - 'justfile'
              - 'scripts/**'

            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - 'crates/**/*.tracker'
              - 'crates/**/*.json'
              - 'crates/**/tests/**'
              - 'crates/**/benches/**'
              - 'crates/tracen_pack_codegen/templates/**'

            ts:
              - '**/*.ts'
              - '**/*.tsx'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'crates/tracen_pack_codegen/templates/**'
              - 'crates/tracen_pack_codegen/tests/**'

            audit:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'

  rust:
    name: rust
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Snapshot characterization tests
        run: just snapshot-check

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  ts:
    name: ts
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.ts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TypeScript checks
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "No root package.json found; generated TypeScript is covered by Rust pack-codegen snapshots."
            exit 0
          fi

          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm run typecheck --if-present
            pnpm test --if-present
          elif [ -f package-lock.json ]; then
            npm ci
            npm run typecheck --if-present
            npm test --if-present
          else
            npm install
            npm run typecheck --if-present
            npm test --if-present
          fi

  security-audit:
    name: security-audit
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.audit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit

      - name: Cargo audit
        run: cargo audit
        continue-on-error: true

  pipeline:
    name: pipeline
    needs:
      - changes
      - rust
      - ts
      - security-audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI result
        run: |
          set -euo pipefail

          check_result() {
            name="$1"
            result="$2"

            echo "$name => $result"

            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "$name failed with result: $result"
              exit 1
            fi
          }

          check_result "changes" "${{ needs.changes.result }}"
          check_result "rust" "${{ needs.rust.result }}"
          check_result "ts" "${{ needs.ts.result }}"
          check_result "security-audit" "${{ needs.security-audit.result }}"
