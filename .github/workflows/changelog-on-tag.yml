name: Changelog on tag

on:
  repository_dispatch:
    types:
      - release-tagged
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.event.client_payload.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: taiki-e/install-action@just

      - name: Append changelog entry if needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || github.ref_name }}
        run: just workflow-changelog-on-tag
